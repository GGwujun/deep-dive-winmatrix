[book]
title = "深入理解 WinMatrix 源码"
authors = ["WinMatrix Team"]
description = "系统剖析 WinMatrix AI 数字员工协作平台的架构设计、工程实践与设计哲学"
language = "zh"
src = "src"

[build]
build-dir = "docs"

[output.html]
default-theme = "light"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/GGwujun/deep-dive-winmatrix"
edit-url-template = "https://github.com/GGwujun/deep-dive-winmatrix/edit/main/src/{path}"
no-section-label = false
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.fold]
enable = true
level = 1
